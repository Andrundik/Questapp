<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuestBoard Mini App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--tg-theme-bg-color, #0f0f0f);
            color: var(--tg-theme-text-color, #ffffff);
            margin: 0;
            padding: 16px;
            padding-bottom: 80px;
        }
        h1 { font-size: 20px; text-align: center; margin-bottom: 16px; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        
        .quest-card {
            background: var(--tg-theme-secondary-bg-color, #1c1c1e);
            border-radius: 12px;
            padding: 12px 16px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .quest-info { display: flex; align-items: center; gap: 12px; }
        .quest-avatar { width: 48px; height: 48px; border-radius: 50%; object-fit: cover; background: #333; }
        .quest-title { font-weight: 600; font-size: 15px; }
        .quest-reward { font-size: 13px; color: var(--tg-theme-hint-color, #8e8e93); margin-top: 4px; }
        
        .btn {
            background-color: var(--tg-theme-button-color, #2481cc);
            color: var(--tg-theme-button-text-color, #ffffff);
            border: none;
            border-radius: 8px;
            padding: 8px 14px;
            font-weight: 600;
            cursor: pointer;
        }

        /* Навигация (вкладки снизу) */
        .nav-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: var(--tg-theme-secondary-bg-color, #1c1c1e);
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            border-top: 1px solid rgba(255,255,255,0.1);
        }
        .nav-item {
            background: none;
            border: none;
            color: var(--tg-theme-hint-color, #8e8e93);
            font-size: 12px;
            cursor: pointer;
            text-align: center;
        }
        .nav-item.active {
            color: var(--tg-theme-button-color, #2481cc);
            font-weight: 600;
        }

        /* Рулетка */
        .roulette-container {
            text-align: center;
            margin-top: 40px;
        }
        .roulette-box {
            font-size: 28px;
            font-weight: bold;
            background: var(--tg-theme-secondary-bg-color, #1c1c1e);
            padding: 30px;
            border-radius: 16px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

    <!-- Вкладка 1: Квесты -->
    <div id="tab-quests" class="tab-content active">
        <h1>📋 Доска Квестов</h1>
        <div id="quests-list">
            <p style="text-align: center; color: gray;">Загрузка квестов...</p>
        </div>
    </div>

    <!-- Вкладка 2: Рулетка -->
    <div id="tab-roulette" class="tab-content">
        <h1>🎯 Рулетка</h1>
        <div class="roulette-container">
            <div class="roulette-box" id="rouletteResult">🎁 Нажми крутить!</div>
            <button class="btn" onclick="spinRoulette()" style="padding: 12px 24px; font-size: 16px;">Крутить рулетку</button>
        </div>
    </div>

    <!-- Нижнее меню (Вкладки) -->
    <div class="nav-bar">
        <button class="nav-item active" onclick="switchTab('quests', this)">📋 Квесты</button>
        <button class="nav-item" onclick="switchTab('roulette', this)">🎯 Рулетка</button>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        // Переключение вкладок
        function switchTab(tabName, element) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));

            document.getElementById('tab-' + tabName).classList.add('active');
            element.classList.add('active');
        }

        // Загрузка квестов (синхронизированные с localStorage или дефолтные)
        let defaultQuests = [
            {
                title: "Pavel Durov",
                avatar: "https://t.me/i/userpic/300/durov.jpg",
                reward: "50 XP"
            }
        ];

        let quests = JSON.parse(localStorage.getItem('my_quests')) || defaultQuests;

        function renderQuests() {
            const listEl = document.getElementById('quests-list');
            listEl.innerHTML = '';

            if (quests.length === 0) {
                listEl.innerHTML = '<p style="text-align: center; color: gray;">Пока нет активных квестов.</p>';
                return;
            }

            quests.forEach((quest, index) => {
                listEl.innerHTML += `
                    <div class="quest-card">
                        <div class="quest-info">
                            <img src="${quest.avatar}" class="quest-avatar" alt="icon" onerror="this.src='https://t.me/i/userpic/300/durov.jpg'">
                            <div>
                                <div class="quest-title">${quest.title}</div>
                                <div class="quest-reward">Награда: ${quest.reward}</div>
                            </div>
                        </div>
                        <button class="btn" onclick="completeQuest(${index})">Выполнить</button>
                    </div>
                `;
            });
        }

        function completeQuest(index) {
            alert('Квест выполнен!');
            quests.splice(index, 1);
            localStorage.setItem('my_quests', JSON.stringify(quests));
            renderQuests();
        }

        // Логика рулетки
        function spinRoulette() {
            const prizes = ["10 XP", "50 XP", "100 Stars", "Ничего :(", "200 XP"];
            let resultBox = document.getElementById('rouletteResult');
            resultBox.innerHTML = "🔄 Крутим...";
            setTimeout(() => {
                let randomPrize = prizes[Math.floor(Math.random() * prizes.length)];
                resultBox.innerHTML = `🎉 Вы выиграли: ${randomPrize}`;
            }, 1000);
        }

        renderQuests();
    </script>
</body>
</html>
