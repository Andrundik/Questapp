<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quest Board Mini App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
            margin: 0;
            padding: 16px;
        }
        h1 { font-size: 22px; text-align: center; margin-bottom: 20px; }
        .quest-card {
            background: var(--tg-theme-secondary-bg-color, #f1f1f1);
            border-radius: 12px;
            padding: 12px 16px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .quest-info { display: flex; align-items: center; gap: 12px; }
        .quest-avatar { width: 48px; height: 48px; border-radius: 50%; object-fit: cover; background: #ccc; }
        .quest-title { font-weight: 600; font-size: 16px; }
        .quest-reward { font-size: 13px; color: var(--tg-theme-hint-color, #777); margin-top: 4px; }
        .btn {
            background-color: var(--tg-theme-button-color, #2481cc);
            color: var(--tg-theme-button-text-color, #ffffff);
            border: none;
            border-radius: 8px;
            padding: 8px 14px;
            font-weight: 600;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <h1>📋 Доска Квестов</h1>

    <!-- Список квестов -->
    <div id="quests-list">
        <!-- Квесты будут подгружаться сюда -->
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        // Пример дефолтных квестов на случай первого запуска (админ может добавлять новые через бота)
        let defaultQuests = [
            {
                title: "Подписка на канал",
                avatar: "https://t.me/i/userpic/300/durov.jpg",
                reward: "50 XP"
            }
        ];

        let quests = JSON.parse(localStorage.getItem('my_quests')) || defaultQuests;

        function renderQuests() {
            const listEl = document.getElementById('quests-list');
            listEl.innerHTML = '';

            if (quests.length === 0) {
                listEl.innerHTML = '<p style="text-align: center; color: gray;">Пока нет активных квестов.</p>';
                return;
            }

            quests.forEach((quest, index) => {
                listEl.innerHTML += `
                    <div class="quest-card">
                        <div class="quest-info">
                            <img src="${quest.avatar}" class="quest-avatar" alt="icon" onerror="this.src='https://t.me/i/userpic/300/durov.jpg'">
                            <div>
                                <div class="quest-title">${quest.title}</div>
                                <div class="quest-reward">Награда: ${quest.reward}</div>
                            </div>
                        </div>
                        <button class="btn" onclick="completeQuest(${index})">Выполнить</button>
                    </div>
                `;
            });
        }

        function completeQuest(index) {
            alert('Квест выполнен!');
            quests.splice(index, 1);
            localStorage.setItem('my_quests', JSON.stringify(quests));
            renderQuests();
        }

        renderQuests();
    </script>
</body>
</html>
