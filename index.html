<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quest Board Mini App</title>
    <!-- Официальный скрипт Telegram Web App -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
            margin: 0;
            padding: 16px;
        }
        h1 { font-size: 22px; text-align: center; margin-bottom: 20px; }
        .quest-card {
            background: var(--tg-theme-secondary-bg-color, #f1f1f1);
            border-radius: 12px;
            padding: 12px 16px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .quest-info { display: flex; align-items: center; gap: 12px; }
        .quest-avatar { width: 48px; height: 48px; border-radius: 50%; object-fit: cover; background: #ccc; }
        .quest-title { font-weight: 600; font-size: 16px; }
        .quest-reward { font-size: 13px; color: var(--tg-theme-hint-color, #777); margin-top: 4px; }
        .btn {
            background-color: var(--tg-theme-button-color, #2481cc);
            color: var(--tg-theme-button-text-color, #ffffff);
            border: none;
            border-radius: 8px;
            padding: 8px 14px;
            font-weight: 600;
            cursor: pointer;
        }
        .form-container {
            margin-top: 30px;
            background: var(--tg-theme-secondary-bg-color, #f1f1f1);
            padding: 16px;
            border-radius: 12px;
        }
        input {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            border-radius: 8px;
            border: 1px solid #ccc;
            box-sizing: border-box;
        }
    </style>
</head>
<body>

    <h1>📋 Доска Квестов</h1>

    <!-- Список квестов -->
    <div id="quests-list">
        <!-- Сюда динамически добавляются квесты -->
    </div>

    <!-- Форма создания квеста прямо в Mini App -->
    <div class="form-container">
        <h3>Создать новый квест</h3>
        <input type="text" id="inputName" placeholder="Название квеста (оставьте пустым для авто-подтяжки)">
        <input type="text" id="inputChannel" placeholder="Юзернейм канала (например: @durov)">
        <input type="text" id="inputReward" placeholder="Награда (например: 50 XP)">
        <button class="btn" onclick="addNewQuest()" style="width: 100%;">Добавить квест</button>
    </div>

    <script>
        // Инициализация Telegram Web App
        let tg = window.Telegram.WebApp;
        tg.expand();

        // Базовый массив квестов (хранится в памяти браузера)
        let quests = JSON.parse(localStorage.getItem('my_quests')) || [];

        function renderQuests() {
            const listEl = document.getElementById('quests-list');
            listEl.innerHTML = '';

            if (quests.length === 0) {
                listEl.innerHTML = '<p style="text-align: center; color: gray;">Пока нет активных квестов.</p>';
                return;
            }

            quests.forEach((quest, index) => {
                listEl.innerHTML += `
                    <div class="quest-card">
                        <div class="quest-info">
                            <img src="${quest.avatar}" class="quest-avatar" alt="icon">
                            <div>
                                <div class="quest-title">${quest.title}</div>
                                <div class="quest-reward">Награда: ${quest.reward}</div>
                            </div>
                        </div>
                        <button class="btn" onclick="completeQuest(${index})">Выполнить</button>
                    </div>
                `;
            });
        }

        async function addNewQuest() {
            let customName = document.getElementById('inputName').value.trim();
            let channel = document.getElementById('inputChannel').value.trim();
            let reward = document.getElementById('inputReward').value.trim() || '10 XP';

            if (!channel) {
                alert('Укажите юзернейм канала!');
                return;
            }

            // Очищаем юзернейм от символа @ для запросов
            let cleanChannel = channel.replace('@', '');
            
            // Автоматическое подтягивание данных из публичного источника Telegram (превью канала)
            let title = customName !== "" ? customName : `Подписка на @${cleanChannel}`;
            // Стандартная публичная ссылка на аватарку Telegram-канала по юзернейму
            let avatar = `https://t.me/i/userpic/300/${cleanChannel}.jpg`;

            quests.push({
                title: title,
                avatar: avatar,
                reward: reward
            });

            localStorage.setItem('my_quests', JSON.stringify(quests));
            
            // Очистка полей ввода
            document.getElementById('inputName').value = '';
            document.getElementById('inputChannel').value = '';
            document.getElementById('inputReward').value = '';

            renderQuests();
        }

        function completeQuest(index) {
            alert('Квест выполнен!');
            quests.splice(index, 1);
            localStorage.setItem('my_quests', JSON.stringify(quests));
            renderQuests();
        }

        // Первичная отрисовка при загрузке
        renderQuests();
    </script>
</body>
</html>
